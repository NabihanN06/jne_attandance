appId: id.co.jne.mtp.absensi
---
# First-login flow: an account with firstLogin=true is forced to the mandatory
# change-password screen and cannot skip it. Requires FIRST_LOGIN_* env creds.
- launchApp:
    appId: "id.co.jne.mtp.absensi"
    clearState: true
    permissions:
      all: "allow"

- tapOn: "Email"
- inputText: "${FIRST_LOGIN_EMAIL}"
- tapOn: "Password"
- inputText: "${FIRST_LOGIN_PASSWORD}"
- hideKeyboard
- tapOn: "Masuk"

# ChangePasswordRequiredScreen should appear.
# TODO: replace with a stable title from change_password_required_screen.dart.
- assertVisible: "Kata Sandi"

# Back must be blocked — pressing back should keep us on the same screen.
- back
- assertVisible: "Kata Sandi"

# TODO: fill new password twice + submit, then assert we proceed to enroll/home.
