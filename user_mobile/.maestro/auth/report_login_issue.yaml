# "Lapor Login" — a user who cannot log in files a ticket WITHOUT auth
# (writes to the `login_issues` collection). Reached from the login screen.
- launchApp:
    appId: "id.co.jne.mtp.absensi"
    clearState: true
    permissions:
      all: "allow"

